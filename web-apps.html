<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Apps</title>

    <style>
    body {
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      background: #6D61FA url('https://raw.githubusercontent.com/JAhjahingham/onn/refs/heads/main/images/background.jpg') no-repeat center center / cover;
    }

    h1 {
      color: rgb(0, 47, 255);
      border: 2px solid green;
      padding: 10px;
      background-color: black;
      margin-top: 0;
      max-width: 90%;
    }

    .button {
      color: blue; 
      font-size: 32px; 
      padding: 10px;
      border: 2px solid green;
      font-family: 'Arial'; 
      background-color: #000000; 
      margin: 0;
    }    

    .description {
      color: white;
      border: 2px solid red;
      padding: 10px;
      background-color: black;
      max-width: 90%;
    }

    .btn-group {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
    }

    .btn-group a {
      text-decoration: none;
      width: 100%;
    }

    .btn-group button {
      background-color: #000000;
      border: 1px solid green;
      color: white;
      padding: 16px;
      cursor: pointer;
      width: 100%;
      font-size: 18px;
      text-align: center;
      box-sizing: border-box;
      transition: background-color 0.2s ease;
    }

    .btn-group a:not(:last-child) button {
      border-bottom: none;
    }

    .btn-group button:hover {
      background-color: #3e8e41;
    }
  </style>

    
</head>
<body>
<h1>Web Apps And Games</h1>
    <div class="btn-group">
        <a href="https://jahjahingham.github.io/Flappybirdclone/">
      <button>Flappy Bird - Mobile</button>
    </a>
    <a href="https://jahjahingham.github.io/Flappybirdclonepc/">
      <button>Flappy Bird - PC</button>
    </a>
    <a href="https://jahjahingham.github.io/Pong/">
      <button>Pong</button>
    </a>
    <a href="https://jahjahingham.github.io/snake/">
        <button>Snake</button>
    </a>
    </div>

    <button class="button" >HOME</button>

</body>
</html>
