<!Doctype html>
<html>
    <style>
.btn-group button {
  background-color: #04AA6D; /* Green background */
  border: 1px solid green; /* Green border */
  color: white; /* White text */
  padding: 10px 24px; /* Some padding */
  cursor: pointer; /* Pointer/hand icon */
  width: 50%; /* Set a width if needed */
  display: block; /* Make the buttons appear below each other */
}

.btn-group button:not(:last-child) {
  border-bottom: none; /* Prevent double borders */
}

/* Add a background color on hover */
.btn-group button:hover {
  background-color: #3e8e41;
}
</style>
<body>

<h1>Vertical Button Group</h1>

<div
class="btn-group-vertical"> 
    <a href="https://github.com/JAhjahingham/onn/releases/download/StreamFlix/streamflix-v1.7.222-only-tv.apk" class="download-btn">
        <button>SteamFlix</button></a>
    <a href="https://github.com/JAhjahingham/onn/releases/download/SmartTube/SmartTube_stable_31.94_universal.apk">
        <button>SmartTube (AD Free Youtube)</button></a>
</div>
    
</body>
</html>
